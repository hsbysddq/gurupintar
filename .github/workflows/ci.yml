name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # Build tidak menjalankan query database. Nilai dummy dipakai agar
      # modul server tidak gagal saat build di runner tanpa .env.local.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_dummy
          SUPABASE_SERVICE_ROLE_KEY: dummy
          KODE_UNDANGAN_GURU: dummy
