server {
    listen 80;
    listen [::]:80;
    server_name gurupintar.example.com www.gurupintar.example.com;

    # PDF modul maksimal 5 MB; base64 menambah sekitar 33% sebelum dikirim ke API.
    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;

        # Pembuatan materi AI punya batas 70 detik, jadi jangan pakai bawaan 60 detik.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
}
